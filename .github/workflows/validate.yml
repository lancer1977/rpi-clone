name: Validate

on:
  push:
  pull_request:

concurrency:
  group: rpi-clone-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run validation
        run: ./scripts/validate.sh
